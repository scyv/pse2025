<!DOCTYPE html>
<html>

<body>
    <h1>KeyCloak Authentication Demo</h1>

    <p>
    <pre></pre>
    </p>

    <button id="protected-btn" style="display:none;">Geschützten Endpunkt aufrufen</button>
    <pre id="api-result"></pre>

    <button style="display:none;">Logout</button>
</body>


<script type="module">

    import Keycloak from 'https://cdn.jsdelivr.net/npm/keycloak-js@26.2.1/+esm'

    const keycloak = new Keycloak({
        "url": "http://localhost:8780/",
        "realm": "SuperApp",
        "clientId": "superapp"
    });

    (async () => {
        try {
            const authenticated = await keycloak.init();
            if (authenticated) {
                console.log('User is authenticated', keycloak.idTokenParsed);
                document.querySelector("pre").textContent = JSON.stringify(keycloak.idTokenParsed, null, 4)

                const protectedBtn = document.getElementById("protected-btn");
                protectedBtn.style.display = "block";
                protectedBtn.addEventListener("click", async () => {
                    // Token ggf. auffrischen, dann Bearer-Header senden
                    await keycloak.updateToken(10);
                    const resp = await fetch("/api/protected", {
                        headers: { "Authorization": "Bearer " + keycloak.token }
                    });
                    const data = await resp.json();
                    document.getElementById("api-result").textContent = JSON.stringify(data, null, 4);
                });

                const logoutButton = document.querySelector("button:last-of-type");
                logoutButton.textContent = "Logout " + keycloak.idTokenParsed.name;
                logoutButton.style.display = "block";
                logoutButton.addEventListener("click", () => {
                    keycloak.logout();
                    logoutButton.style.display = "none";
                }, { once: true })

            } else {
                keycloak.login({
                    scope: "roles"
                });
                console.log('User is not authenticated');
            }
        } catch (error) {
            console.error('Failed to initialize adapter:', error);
        }
    })();

</script>

</html>
